name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      # Only trigger an APK rebuild when something that actually changes the
      # native shell or build pipeline changes. Routine src/ changes propagate
      # to the live app via WebView auto-refresh — no APK rebuild needed.
      - 'capacitor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web app dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Build web app (Vite)
        working-directory: .
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Install capacitor dependencies
        working-directory: capacitor
        run: npm ci || npm install

      - name: Sync Capacitor Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon -x test

      - name: Compute version label (owner scheme vMAJOR.APK_UPDATES.WEB_UPDATES)
        # Version scheme (Oct 13 2026): vMAJOR.APK.WEB — MAJOR bumps only on
        # owner request; APK updates = workflow run_number - baseline (starts
        # at 0 as of run 334); WEB updates = deploy counter in src/version.js
        # (starts at 334, bumped per web deploy). The raw run number is kept
        # in the artifact filename tail so update detection stays monotonic.
        run: |
          MAJOR=$(grep -oP 'APP_VERSION_MAJOR = \K[0-9]+' src/version.js)
          BASELINE=$(grep -oP 'APK_VERSION_BASELINE = \K[0-9]+' src/version.js)
          WEB=$(grep -oP 'WEB_VERSION = \K[0-9]+' src/version.js)
          APK_UPDATES=$(( GITHUB_RUN_NUMBER - BASELINE ))
          if [ "$APK_UPDATES" -lt 0 ]; then APK_UPDATES=0; fi
          echo "APK_VERSION_NAME=v${MAJOR}.${APK_UPDATES}.${WEB}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${MAJOR}.${APK_UPDATES}.${WEB}" >> "$GITHUB_ENV"
          echo "Version label: v${MAJOR}.${APK_UPDATES}.${WEB} (build run ${GITHUB_RUN_NUMBER})"

      - name: Rename APK with version label
        working-directory: capacitor/android/app/build/outputs/apk/debug
        run: |
          cp rxdeliver-debug.apk "rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          echo "Renamed APK to rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdeliver-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: Delete previous latest release
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RxDeliver Android APK (Latest)
          body: |
            Auto-built debug APK from commit ${{ github.sha }}

            - Grey icon with "Rx" branding
            - Background GPS via @capgo/background-geolocation
            - Dynamic environment routing (admin=preview, driver=live)
            - OAuth deep-link callback (rxdeliver://auth)

            Download the .apk file below and install on your Android device.
          files: capacitor/android/app/build/outputs/apk/debug/rxdeliver-${{ env.APK_VERSION_NAME }}-b${{ github.run_number }}.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
