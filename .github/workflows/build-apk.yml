name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      # Only trigger an APK rebuild when something that actually changes the
      # native shell or build pipeline changes. Routine src/ changes propagate
      # to the live app via WebView auto-refresh — no APK rebuild needed.
      - 'capacitor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web app dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Build web app (Vite)
        working-directory: .
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Install capacitor dependencies
        working-directory: capacitor
        run: npm ci || npm install

      - name: Sync Capacitor Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compute version label (owner scheme vMAJOR.APK_UPDATES.WEB_UPDATES)
        # Version scheme (Oct 13 2026, RESET RULE added Oct 21 2026):
        # vMAJOR.APK.WEB — MAJOR bumps only on owner request; APK updates =
        # SUCCESSFUL build count - baseline (baseline 316 = successful runs
        # when the scheme took effect, so the digit starts at 0; failed runs
        # never increment it); WEB updates = deploy counter in src/version.js.
        # RESET RULE (owner, Oct 21 2026): every APK update resets the web
        # counter — this build IS the new baseline, so the APK label bakes
        # web digit 0, and the post-release step resets the constant in the
        # repo so the next web deploy counts from 1. The raw run number is
        # kept in the artifact filename tail so update detection stays
        # monotonic.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # MAJOR became HOST-DERIVED on Oct 30 2026 (resolveAppMajorVersion),
          # so the old 'APP_VERSION_MAJOR = <digit>' grep matched nothing and
          # every build since failed right here. The APK shell loads
          # rxdeliver.wizardworxx.com — an app subdomain of the new domain — so
          # the digit baked into the APK is the NEW_DOMAIN value.
          MAJOR=$(grep -oP 'APP_VERSION_MAJOR_NEW_DOMAIN = \K[0-9]+' src/version.js || true)
          if [ -z "$MAJOR" ]; then MAJOR=2; fi
          BASELINE=$(grep -oP 'APK_SUCCESS_BASELINE = \K[0-9]+' src/version.js)
          # Count SUCCESSFUL builds only; this run is still in progress so it
          # is not counted — if this build succeeds it becomes the +1.
          SUCCESSES=$(gh api "repos/TheWizard1328/Shoppers/actions/workflows/build-apk.yml/runs?status=success&per_page=1" --jq '.total_count')
          APK_UPDATES=$(( SUCCESSES - BASELINE ))
          if [ "$APK_UPDATES" -lt 0 ]; then APK_UPDATES=0; fi
          # RESET RULE: the APK bakes web digit 0 — each APK update starts a
          # fresh web counter (repo constant is reset post-release).
          echo "APK_VERSION_NAME=v${MAJOR}.${APK_UPDATES}.0" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${MAJOR}.${APK_UPDATES}.0" >> "$GITHUB_ENV"
          echo "Version label: v${MAJOR}.${APK_UPDATES}.0 (build run ${GITHUB_RUN_NUMBER})"
          # Handed to the "publish release info" step below so the app-served
          # public/apk-release.json carries the same numbers this APK baked.
          echo "APK_UPDATES=${APK_UPDATES}" >> "$GITHUB_ENV"
          echo "APK_SUCCESSES_AFTER=$(( SUCCESSES + 1 ))" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon -x test

      - name: Rename APK with version label
        working-directory: capacitor/android/app/build/outputs/apk/debug
        run: |
          cp rxdeliver-debug.apk "rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          echo "Renamed APK to rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdeliver-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: Delete previous latest release
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RxDeliver Android APK (Latest)
          body: |
            Auto-built debug APK from commit ${{ github.sha }}

            - Grey icon with "Rx" branding
            - Background GPS via @capgo/background-geolocation
            - Dynamic environment routing (admin=preview, driver=live)
            - OAuth deep-link callback (rxdeliver://auth)

            Download the .apk file below and install on your Android device.
          files: capacitor/android/app/build/outputs/apk/debug/rxdeliver-${{ env.APK_VERSION_NAME }}-b${{ github.run_number }}.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK release info + reset web counter (owner rule, Oct 21 2026)
        # Two jobs in ONE commit:
        #  1) public/apk-release.json — the app reads the newest release from its
        #     OWN origin (owner report Nov 10 2026: "the flashlight got built but
        #     there was no notification for the APK update"). The old path polled
        #     api.github.com unauthenticated, 60 req/hr PER IP; several devices
        #     behind one pharmacy IP burned that budget and every device then sat
        #     on a stale localStorage mirror, so the blue APK arrow never came.
        #  2) Reset WEB_VERSION to 0 and bake this APK digit into src/version.js
        #     (the APK is the new web baseline).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ---- 1) app-served release info (always refreshed) ----
          APK_FILE="rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          APK_URL="https://github.com/TheWizard1328/Shoppers/releases/download/apk-latest/${APK_FILE}"
          BAKED_DIGIT=$(echo "${APK_VERSION_NAME#v}" | cut -d. -f2)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p public
          cat > public/apk-release.json <<JSON
          {
            "buildNumber": ${GITHUB_RUN_NUMBER},
            "successCount": ${APK_SUCCESSES_AFTER},
            "apkUpdates": ${BAKED_DIGIT},
            "releaseVersion": "${APP_VERSION_NAME}",
            "apkDigit": ${BAKED_DIGIT},
            "apkFileName": "${APK_FILE}",
            "apkUrl": "${APK_URL}",
            "publishedAt": "${PUBLISHED_AT}",
            "notes": "Written by .github/workflows/build-apk.yml on every successful APK build. Read by src/components/utils/useBuildInfo.js from the app's own origin so update detection never depends on the GitHub API rate limit."
          }
          JSON
          echo "Wrote public/apk-release.json for ${APK_VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"

          # ---- 2) reset the web counter (owner rule) ----
          CURRENT=$(grep -oP 'WEB_VERSION = \K[0-9]+' src/version.js || echo 0)
          if [ "$CURRENT" != "0" ]; then
            sed -i "s/export const WEB_VERSION = [0-9]\+/export const WEB_VERSION = 0/" src/version.js
            echo "Web counter reset to 0 (was ${CURRENT})."
          else
            echo "Web counter already 0 — nothing to reset."
          fi
          if [ -n "$BAKED_DIGIT" ]; then
            sed -i "s/export const BAKED_APK_DIGIT = [0-9]\+/export const BAKED_APK_DIGIT = ${BAKED_DIGIT}/" src/version.js
            echo "Baked APK digit set to ${BAKED_DIGIT}"
          fi

          git add public/apk-release.json src/version.js
          git commit -m "chore(apk): publish apk-release.json for build ${GITHUB_RUN_NUMBER} + reset web counter (owner rule Oct 21 2026)" || {
            echo "Nothing to commit"; exit 0;
          }
          git pull --rebase origin main || true
          git push origin HEAD:main
