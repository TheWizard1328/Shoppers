name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web app dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Build web app (Vite)
        working-directory: .
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Install capacitor dependencies
        working-directory: capacitor
        run: npm ci || npm install

      - name: Sync Capacitor Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon -x test

      - name: Rename APK with build number
        working-directory: capacitor/android/app/build/outputs/apk/debug
        run: |
          BUILD_NUM="${GITHUB_RUN_NUMBER:-unknown}"
          cp rxdeliver-debug.apk "rxdeliver-v1.0.${BUILD_NUM}.apk"
          echo "Renamed APK to rxdeliver-v1.0.${BUILD_NUM}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdeliver-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: Delete previous latest release
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RxDeliver Android APK (Latest)
          body: |
            Auto-built debug APK from commit ${{ github.sha }}

            - Grey icon with "Rx" branding
            - Background GPS via @capgo/background-geolocation
            - Dynamic environment routing (admin=preview, driver=live)
            - OAuth deep-link callback (rxdeliver://auth)

            Download the .apk file below and install on your Android device.
          files: capacitor/android/app/build/outputs/apk/debug/rxdeliver-v1.0.${{ github.run_number }}.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
