name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      # Only trigger an APK rebuild when something that actually changes the
      # native shell or build pipeline changes. Routine src/ changes propagate
      # to the live app via WebView auto-refresh — no APK rebuild needed.
      - 'capacitor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web app dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Build web app (Vite)
        working-directory: .
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Install capacitor dependencies
        working-directory: capacitor
        run: npm ci || npm install

      - name: Sync Capacitor Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compute version label (owner scheme vMAJOR.APK_UPDATES.WEB_UPDATES)
        # Version scheme (Oct 13 2026, RESET RULE added Oct 21 2026):
        # vMAJOR.APK.WEB — MAJOR bumps only on owner request; APK updates =
        # SUCCESSFUL build count - baseline (baseline 316 = successful runs
        # when the scheme took effect, so the digit starts at 0; failed runs
        # never increment it); WEB updates = deploy counter in src/version.js.
        # RESET RULE (owner, Oct 21 2026): every APK update resets the web
        # counter — this build IS the new baseline, so the APK label bakes
        # web digit 0, and the post-release step resets the constant in the
        # repo so the next web deploy counts from 1. The raw run number is
        # kept in the artifact filename tail so update detection stays
        # monotonic.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR=$(grep -oP 'APP_VERSION_MAJOR = \K[0-9]+' src/version.js)
          BASELINE=$(grep -oP 'APK_SUCCESS_BASELINE = \K[0-9]+' src/version.js)
          # Count SUCCESSFUL builds only; this run is still in progress so it
          # is not counted — if this build succeeds it becomes the +1.
          SUCCESSES=$(gh api "repos/TheWizard1328/Shoppers/actions/workflows/build-apk.yml/runs?status=success&per_page=1" --jq '.total_count')
          APK_UPDATES=$(( SUCCESSES - BASELINE ))
          if [ "$APK_UPDATES" -lt 0 ]; then APK_UPDATES=0; fi
          # RESET RULE: the APK bakes web digit 0 — each APK update starts a
          # fresh web counter (repo constant is reset post-release).
          echo "APK_VERSION_NAME=v${MAJOR}.${APK_UPDATES}.0" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${MAJOR}.${APK_UPDATES}.0" >> "$GITHUB_ENV"
          echo "Version label: v${MAJOR}.${APK_UPDATES}.0 (build run ${GITHUB_RUN_NUMBER})"

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon -x test

      - name: Rename APK with version label
        working-directory: capacitor/android/app/build/outputs/apk/debug
        run: |
          cp rxdeliver-debug.apk "rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          echo "Renamed APK to rxdeliver-${APK_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdeliver-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: Delete previous latest release
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RxDeliver Android APK (Latest)
          body: |
            Auto-built debug APK from commit ${{ github.sha }}

            - Grey icon with "Rx" branding
            - Background GPS via @capgo/background-geolocation
            - Dynamic environment routing (admin=preview, driver=live)
            - OAuth deep-link callback (rxdeliver://auth)

            Download the .apk file below and install on your Android device.
          files: capacitor/android/app/build/outputs/apk/debug/rxdeliver-${{ env.APK_VERSION_NAME }}-b${{ github.run_number }}.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset web deploy counter (owner rule, Oct 21 2026)
        # Each successful APK update starts a fresh web counter. This step
        # resets WEB_VERSION to 0 in src/version.js and pushes to main so the
        # next web deploy counts from 1. The push does NOT match the workflow
        # path triggers (src/version.js only), so it can't re-trigger builds.
        # A failed build never reaches this step — only real APK updates
        # reset the counter.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(grep -oP 'WEB_VERSION = \K[0-9]+' src/version.js || echo 0)
          if [ "$CURRENT" = "0" ]; then
            echo "Web counter already 0 — nothing to reset."
            exit 0
          fi
          sed -i "s/export const WEB_VERSION = [0-9]\+/export const WEB_VERSION = 0/" src/version.js
          git add src/version.js
          git commit -m "chore(version): reset web counter to 0 after APK build run ${GITHUB_RUN_NUMBER} (owner rule Oct 21 2026)"
          git pull --rebase origin main || true
          git push origin HEAD:main
          echo "Web counter reset to 0 (was ${CURRENT})."
