apply plugin: 'com.android.application'

// Auto-incrementing versionCode computed at build time (minutes since a
// fixed epoch: 2024-01-01 00:00 UTC). Android requires versionCode to
// strictly increase for the system to treat a new APK as an "update" to an
// existing install rather than a same-version no-op. A hardcoded versionCode
// (it was stuck at 1 forever) combined with a changing debug-keystore
// signature is why users had to uninstall before every single update.
def computedVersionCode = ((System.currentTimeMillis() / 1000 / 60) - 28401120L) as int
def buildDateStr = new Date().format('yyyy-MM-dd HH:mm')
// Build number: GitHub Actions automatically sets GITHUB_RUN_NUMBER env var.
// For local builds, falls back to computedVersionCode so it always increments.
// We check env first (works without modifying the workflow YAML), then -P flag,
// then computedVersionCode as last resort.
def buildNumber = System.env.GITHUB_RUN_NUMBER ?: (project.hasProperty('buildNumber') ? project.getProperty('buildNumber') : String.valueOf(computedVersionCode))

android {
    namespace "com.rxdeliver.driver"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rxdeliver.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName "1.0.${buildNumber} (${buildDateStr})"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Pinned debug keystore (checked into the repo) so every CI build produces
    // the SAME signing certificate fingerprint across builds. This is required
    // for Android App Links (Digital Asset Links / assetlinks.json) verification
    // to keep working release after release — the default auto-generated debug
    // keystore would otherwise get a new random fingerprint on every CI run,
    // silently breaking the verified HTTPS OAuth callback deep link.
    signingConfigs {
        debug {
            storeFile file('rxdeliver-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing for Google Play (App Bundle upload key).
        // Credentials come from CI env vars (GitHub Actions secrets:
        // ANDROID_KEYSTORE_BASE64 decoded to rxdeliver-release.p12 by the
        // build-aab workflow). Never checked into the repo.
        release {
            if (System.env.RXD_STORE_FILE) {
                storeFile file(System.env.RXD_STORE_FILE)
                storePassword System.env.RXD_STORE_PASSWORD
                keyAlias System.env.RXD_KEY_ALIAS
                keyPassword System.env.RXD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Output as rxdeliver-debug.apk so the GitHub Actions release
            // step can find it without a separate rename step.
            applicationVariants.all { variant ->
                if (variant.name == 'debug') {
                    variant.outputs.each { output ->
                        output.outputFileName = 'rxdeliver-debug.apk'
                    }
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Play build uses the release upload key when available (CI);
            // local release builds without the keystore fall back to the
            // pinned debug key so nothing breaks on a dev machine.
            signingConfig System.env.RXD_STORE_FILE ? signingConfigs.release : signingConfigs.debug
        }
    }
    // BuildConfig is off by default in AGP 8+; the native bridge reads
    // PLAY_STORE_BUILD to tell the JS layer which update channel to use.
    buildFeatures {
        buildConfig true
    }
    // PLAY_STORE_BUILD=true marks Play Store builds: the JS layer disables
    // the in-app APK self-updater (Play policy forbids self-installing
    // updates) and the release manifest strips REQUEST_INSTALL_PACKAGES.
    defaultConfig {
        buildConfigField "boolean", "PLAY_STORE_BUILD", "${System.env.PLAY_STORE_BUILD == 'true'}"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
