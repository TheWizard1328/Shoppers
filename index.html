<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/app-manifest.json" />
    <meta name="description" content="RxDeliver delivery dashboard" />
    <!-- trigger redeploy -->
    <title>RxDeliver</title>
      <script>
    // Early dark-mode apply (owner fix, Sep 28): the loading screen flashed
    // LIGHT for ~1-2s before the app mounted and useAutoThemeSync's effect
    // ran, even for users on dark mode — that effect only fires after React
    // renders, so there's a visible flash of the wrong theme every load.
    // This runs synchronously in <head>, before <div id="root"> exists, so
    // the 'dark' class lands on <html> before the loading screen's first
    // paint. Preference source, in order: cached explicit choice
    // (localStorage 'rxdeliver_theme_preference', written by
    // useAutoThemeSync whenever the real preference resolves) → OS/browser
    // dark-mode media query. Matches useAutoThemeSync's own logic exactly so
    // there is no mismatch once React takes over.
    // ── LIVE BUILD GUARD (owner report Nov 2 2026) ──────────────────────
    // A driver published-to device showed no "update available" balloon and
    // only got the new code when he manually refreshed. Reason: the in-app
    // check compares the RUNNING bundle's baked build id against
    // /version.json, and a stale cached bundle can carry 'dev' (or a very old
    // id) so the check silently disabled itself. This runs before React, uses
    // the id stamped into THIS html, and pulls the newer build itself. Two
    // attempts per page session, 6s apart, never in a loop.
    (function() {
      try {
        var meta = document.querySelector('meta[name="rx-build"]');
        var mine = meta ? (meta.getAttribute('content') || '') : '';
        if (!mine) return; // unstamped build (local dev) — in-app check handles it
        var KEY = 'rx_live_build_guard_v1';
        var state = {};
        try { state = JSON.parse(sessionStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
        if ((state.attempts || 0) >= 2) return;
        if (state.lastAt && Date.now() - state.lastAt < 6000) return;
        fetch('/version.json?cb=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(d) {
            var theirs = d && d.buildId ? String(d.buildId) : '';
            if (!theirs || theirs === mine) return;
            try {
              sessionStorage.setItem(KEY, JSON.stringify({ attempts: (state.attempts || 0) + 1, lastAt: Date.now(), from: mine, to: theirs }));
            } catch (e) {}
            // cache-busting navigation: a plain reload can hand back the same
            // stale document from the WebView/browser cache.
            location.replace(location.pathname + '?rxb=' + encodeURIComponent(theirs) + location.hash);
          })
          .catch(function() {});
      } catch (e) {}
    })();

    (function() {
      try {
        var pref = localStorage.getItem('rxdeliver_theme_preference');
        // DEVICE-AWARE DEFAULT (owner directive Nov 13 2026): no cached choice
        // means phones and tablets start in AUTO (follow the device), while a
        // PC / desktop / laptop starts in LIGHT.
        if (!pref) {
          var _ua = navigator.userAgent || '';
          var _isPhoneOrTablet = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(_ua) ||
            (/Mac/i.test(_ua) && navigator.maxTouchPoints > 1);
          pref = _isPhoneOrTablet ? 'auto' : 'light';
        }
        var root = document.documentElement;
        // LIGHT / DARK / AUTO (Auto restored Nov 13 2026 evening). Light is the
        // DEFAULT. An explicit Light or Dark choice never consults the OS; 'auto'
        // follows the device's prefers-color-scheme. Whatever the app wants,
        // foreign classes are cleared first.
        var resolved = pref === 'auto'
          ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
          : (pref === 'dark' ? 'dark' : 'light');
        root.classList.remove('dark', 'dark-theme', 'auto-theme', 'light-theme');
        if (pref === 'auto') root.classList.add('auto-theme');
        var isDark = resolved === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
          // FIX (Sep 29 2026): this early script only ever added Tailwind's
          // 'dark' class, which flips dark: utility classes immediately —
          // but the app's CSS-variable theme (layoutStyles.jsx: --bg-white,
          // --bg-slate-50, --card, etc., used by inline styles like
          // Layout.jsx's <main> background) only responds to 'dark-theme'
          // or 'auto-theme', which useAutoThemeSync only adds AFTER React
          // mounts. Result: a real white flash on every load/page (worst on
          // slower devices/pages) where dark: utility elements were already
          // dark but CSS-var-styled elements (e.g. the main content
          // background) stayed light until React's effect caught up.
          // Mirror useAutoThemeSync's class exactly so both systems agree
          // from the very first paint, matching whichever branch produced
          // isDark (explicit 'dark' pref vs system/auto dark).
          root.classList.add('dark-theme');
        } else {
          root.classList.add('light-theme');
        }
      } catch(e) {}
    })();
    </script>
    <script>
    // Native OAuth redirect: if we land on the PWA with an access_token
    // (from Base44's OAuth callback) on a mobile browser, redirect to the
    // native app via custom scheme BEFORE any modules load. This runs
    // synchronously in <head>, ahead of <script type="module">, so
    // app-params.js hasn't stripped the token from the URL yet.
    (function() {
      try {
        var url = new URL(window.location.href);
        var token = url.searchParams.get('access_token');
        if (token && url.pathname === '/') {
          var ua = navigator.userAgent;
          if (/android/i.test(ua) && /mobile|tablet/i.test(ua)) {
            var params = new URLSearchParams({ access_token: token });
            var rt = url.searchParams.get('refresh_token');
            if (rt) params.set('refresh_token', rt);
            window.location.replace('rxdeliver://auth?' + params.toString());
          }
        }
      } catch(e) {}
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
